apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
data:
  backend_host: backend.{{ .Values.namespace }}.svc.cluster.local
  default.conf.template: |
    server {
        listen {{ .Values.frontend.port }};

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /api/ {
            proxy_pass http://${WORKSHOP_BACKEND_HOST}:{{ .Values.backend.port }}/;
            add_header X-Frontend-Pod $hostname always;
        }
    }
  index.html: |
    <html>
    <body>
      <h1>Slot machine</h1>
      <p id="reels">? ? ?</p>
      <p id="result"></p>
      <button onclick="spin()">Spin</button>
      <script>
        function spin() {
          fetch("/api/spin", { method: "POST" })
            .then(r => r.json().then(d => ({ d: d, fe: r.headers.get("X-Frontend-Pod") })))
            .then(x => {
              document.getElementById("reels").textContent = x.d.reels.join(" | ");
              document.getElementById("result").textContent =
                "win: " + x.d.win + " | coins: " + x.d.coins +
                " | backend: " + x.d.backend_pod + " | frontend: " + x.fe;
            });
        }
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend
      containers:
        - name: nginx
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: "WORKSHOP_"
            - name: WORKSHOP_BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: backend_host
          volumeMounts:
            - name: templates
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: templates
          configMap:
            name: frontend-config
            items:
              - key: default.conf.template
                path: default.conf.template
        - name: html
          configMap:
            name: frontend-config
            items:
              - key: index.html
                path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: http